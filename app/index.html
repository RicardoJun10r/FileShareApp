<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="header">FileShare</h1>
            <p>Esse é um site para hospedar temporariamente seus arquivos, para realizar transferência dos mesmos entre
                dispositivos.</p>
        </div>
        <div id="upload-section">
            <div class="upload-area" onclick="document.getElementById('arquivo').click()">
                <p>Para começar, arraste e solte um arquivo aqui ou clique para selecionar um arquivo.</p>
                <input type="file" id="arquivo" />
                <button class="upload-button" onclick="upload()">Enviar</button>
            </div>
            <div class="files-section">
                <h2 class="section-title">Arquivos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome do Arquivo</th>
                            <th>Tipo</th>
                            <th>Data de Upload</th>
                            <th>Data de Expiração</th>
                            <th>Faça o Download</th>
                        </tr>
                    </thead>
                    <tbody id="tabela">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
