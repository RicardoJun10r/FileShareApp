name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Install locked dependencies
        run: uv sync --locked --dev --group build
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python -c "import os,tomllib; assert os.environ['RELEASE_TAG'] == 'v' + tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - name: Integration tests
        timeout-minutes: 3
        run: uv run python -m unittest discover -s tests -v
      - name: Build native package
        run: uv run --group build python scripts/build.py
      - name: Test extracted executable without external tools
        timeout-minutes: 3
        run: uv run python scripts/smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/FileShare-*.zip
            dist/FileShare-*.tar.gz
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum FileShare-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --title "FileShare $RELEASE_TAG" --notes-file ../packaging/RELEASE_NOTES.md
